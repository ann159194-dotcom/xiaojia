name: 小家 · USER_RETURN

on:
  repository_dispatch:
    types:
      - USER_RETURN

  workflow_dispatch:

permissions:
  contents: write

jobs:
  user-return:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取小家仓库
        uses: actions/checkout@v4

      - name: 写入 USER_RETURN
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "memory/user_activity.json"

          now = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          data["last_user_return"] = now
          data["updated_at"] = now
          data["source"] = "chatgpt"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")

          print("USER_RETURN 已写入")
          print("时间：", now)
          PY

      - name: 保存 USER_RETURN 状态
        run: |
          git config user.name "xiaojia-sentinel"
          git config user.email "actions@github.com"

          git add memory/user_activity.json

          if git diff --cached --quiet; then
            echo "没有状态变化"
          else
            git commit -m "record USER_RETURN"
            git push
          fi
