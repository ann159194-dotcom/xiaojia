name: 小家 · 自唤醒哨兵

on:
  workflow_dispatch:

  repository_dispatch:
    types: [AI_WAKE]

permissions:
  contents: write

jobs:
  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取小家仓库
        uses: actions/checkout@v4

      - name: 检查小家状态
        run: |
          echo "================================"
          echo "🏠 小家 · 自唤醒哨兵"
          echo "================================"

          echo "当前 UTC 时间：$(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "当前北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          echo ""
          echo "📖 读取配置："
          cat config/xiaojia.yaml

          echo ""
          echo "🧠 用户活动："
          cat memory/user_activity.json

          echo ""
          echo "📊 当前状态："
          cat memory/state.json

      - name: 检查用户空闲时间
        run: |
          python scripts/check_idle.py

      - name: 主动唤醒决策
        run: |
          python scripts/wake_decision.py
          
      - name: 生成自主消息
        run: |
          python scripts/generate_wake_message.py
        
      - name: 查看检查结果
        run: |
          echo "================================"
          echo "🧠 检查后的状态"
          echo "================================"
          cat memory/state.json

      - name: 保存状态
        run: |
          git config user.name "xiaojia-sentinel"
          git config user.email "actions@github.com"

          git add memory/state.json

          if git diff --cached --quiet; then
            echo "没有状态变化"
          else
            git commit -m "update wake state"
            git push
          fi
