name: 小家 · 自唤醒哨兵

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取小家仓库
        uses: actions/checkout@v4

      - name: 检查小家状态
        run: |
          echo "================================"
          echo "🏠 小家 · 自唤醒哨兵"
          echo "================================"

          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          echo "当前 UTC 时间：$NOW"
          echo "当前北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

          echo ""
          echo "📖 读取配置："
          cat config/xiaojia.yaml

          echo ""
          echo "🧠 读取状态："
          cat memory/state.json

          echo ""
          echo "✅ 哨兵检查完成"

      - name: 保存检查时间
        run: |
          NOW=$(date -u '+%Y-%m-%dT%H:%M:%SZ')

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          path = "memory/state.json"

          with open(path, "r", encoding="utf-8") as f:
              state = json.load(f)

          state["last_check"] = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          state["status"] = "checked"

          with open(path, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: 提交状态
        run: |
          git config user.name "xiaojia-sentinel"
          git config user.email "actions@github.com"

          git add memory/state.json

          if git diff --cached --quiet; then
            echo "没有状态变化"
          else
            git commit -m "update sentinel state"
            git push
          fi
