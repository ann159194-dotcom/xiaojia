name: 小家 · 自唤醒哨兵

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: 哨兵启动
        run: |
          echo "================================"
          echo "XIAOJIA_SENTINEL=ALIVE"
          echo "================================"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Shanghai: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "Status: 小家哨兵正常运行"
