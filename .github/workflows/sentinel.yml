name: 小家 · 自唤醒哨兵

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取小家仓库
        uses: actions/checkout@v4

      - name: 小家哨兵判断
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta

          CONFIG = "config/xiaojia.yaml"
          STATE = "memory/state.json"
          USER_ACTIVITY = "memory/user_activity.json"

          now = datetime.now(timezone.utc)

          with open(USER_ACTIVITY, "r", encoding="utf-8") as f:
              user = json.load(f)

          with open(STATE, "r", encoding="utf-8") as f:
              state = json.load(f)

          last_user_return = user.get("last_user_return")

          # 如果还没有记录用户回来时间，只记录检查状态
          if not last_user_return:
              state["last_check"] = now.strftime("%Y-%m-%dT%H:%M:%SZ")
              state["status"] = "waiting_for_user_activity"
              state["pending_wake"] = False

          else:
              last = datetime.fromisoformat(
                  last_user_return.replace("Z", "+00:00")
              )

              idle_minutes = (now - last).total_seconds() / 60

              # 转换为北京时间
              bj = now.astimezone(timezone(timedelta(hours=8)))
              hour = bj.hour

              # 白天 08:00 - 24:00
              if 8 <= hour < 24:
                  idle_delay = 30
                  period = "day"
              else:
                  idle_delay = 60
                  period = "night"

              should_wake = idle_minutes >= idle_delay

              state["last_check"] = now.strftime("%Y-%m-%dT%H:%M:%SZ")
              state["status"] = "idle_check"
              state["pending_wake"] = should_wake
              state["current_period"] = period
              state["idle_minutes"] = round(idle_minutes, 1)
              state["idle_delay_minutes"] = idle_delay

              print("================================")
              print("🏠 小家 · 自唤醒判断")
              print("================================")
              print(f"当前北京时间：{bj.strftime('%Y-%m-%d %H:%M:%S')}")
              print(f"最后一次 USER_RETURN：{last_user_return}")
              print(f"已经离开：{idle_minutes:.1f} 分钟")
              print(f"当前时段：{period}")
              print(f"唤醒阈值：{idle_delay} 分钟")
              print(f"是否达到唤醒条件：{should_wake}")

          with open(STATE, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: 保存小家状态
        run: |
          git config user.name "xiaojia-sentinel"
          git config user.email "actions@github.com"

          git add memory/state.json

          if git diff --cached --quiet; then
            echo "没有状态变化"
          else
            git commit -m "update xiaojia sentinel state"
            git push
          fi
